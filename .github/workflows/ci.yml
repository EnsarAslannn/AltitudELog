name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    name: Backend (build & test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Verify Docker is available (required by Testcontainers)
        run: docker info

      - name: Restore dependencies
        run: dotnet restore AltitudELog.slnx

      - name: Build
        run: dotnet build AltitudELog.slnx --configuration Release --no-restore

      - name: Audit dependencies for known vulnerabilities
        env:
          DOTNET_CLI_UI_LANGUAGE: en
        run: |
          dotnet list AltitudELog.slnx package --vulnerable --include-transitive > audit.txt
          cat audit.txt
          if grep -q 'has the following vulnerable packages' audit.txt; then
            echo "::error::Vulnerable packages found. Three top-level PackageReferences exist purely to pin a vulnerable transitive up — see CLAUDE.md before removing any of them."
            exit 1
          fi

      - name: Run tests
        run: >
          dotnet test AltitudELog.slnx --configuration Release --no-build --verbosity normal
          --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ./coverage/**/coverage.cobertura.xml
          if-no-files-found: warn

  frontend:
    name: Frontend (build & lint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test
