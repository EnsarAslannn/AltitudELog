services:
  postgres:
    image: postgres:17-alpine
    container_name: altitudelog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: altitudelog
      POSTGRES_PASSWORD: altitudelog_dev
      POSTGRES_DB: altitudelog
    ports:
      - "5434:5432"
    volumes:
      - altitudelog-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U altitudelog -d altitudelog"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - altitudelog

  redis:
    image: redis:7-alpine
    container_name: altitudelog-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - altitudelog

volumes:
  altitudelog-postgres-data:

networks:
  altitudelog:
    driver: bridge
