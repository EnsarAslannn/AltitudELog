# Local development dependencies for AltitudELog.
#
# Both services are dedicated to this project and bind to non-default host ports
# on purpose: 5432 belongs to the machine's native `postgresql-x64-17` Windows
# service, and the defaults are exactly what neighbouring projects' compose files
# also claim. Odd ports are the price of `docker compose up -d` in this repo never
# depending on what else happens to be running — or not running — on this machine.
#
# The connection strings in src/AltitudELog.API/appsettings.Development.json point
# at these ports and must move with them.
#
# Usage:
#   docker compose up -d          # start
#   docker compose ps             # health
#   docker compose down           # stop, keeping data
#   docker compose down -v        # stop and DELETE the database volume

services:
  postgres:
    image: postgres:17-alpine
    container_name: altitudelog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: altitudelog
      POSTGRES_PASSWORD: altitudelog_dev
      POSTGRES_DB: altitudelog
    ports:
      - "5434:5432"
    volumes:
      - altitudelog-postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Both -U and -d are required: without them pg_isready probes a database
      # named after the default `postgres` role, which this image never creates.
      test: ["CMD-SHELL", "pg_isready -U altitudelog -d altitudelog"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - altitudelog

  redis:
    image: redis:7-alpine
    container_name: altitudelog-redis
    restart: unless-stopped
    # Cached query results only — every value is rebuildable from Postgres, and
    # CachingBehavior is fail-open, so persistence here would buy nothing but a
    # slower shutdown and a stale dump to reason about.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - altitudelog

volumes:
  altitudelog-postgres-data:

networks:
  altitudelog:
    driver: bridge
